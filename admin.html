<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BeLabs - Gestión de Usuarios</title>
   <link rel="stylesheet" href="admin.css">

  <!-- GUARD: esto se ejecuta inmediatamente -->
  <script>
    (function guard() {
      try {
        const data = localStorage.getItem('belabs_auth');

        if (!data) throw new Error('No auth data');

        // if (!data || data.role !== 'admin') {
        //   console.warn('No auth -> redirect to login');
        //   window.location.replace('login.html');
        // }
      } catch (err) {
        console.error(err);
        window.location.replace('login.html');
      }
    })();
  </script>

</head>

<body>

  <aside class="sidebar">
    <h2 class="logo">&lt;BeLabs&gt;</h2>
    <div class="user-profile">
      <img src="https://avatar.iran.liara.run/public/38" alt="Foto de perfil" id="profilePicture" class="user-profile__picture">
      <p id="userEmail" class="user-profile__email"></p>
    </div>
    <ul class="menu">
      <li><a href="#"><span></span> Panel de Control</a></li>
    </ul>
  </aside>

  <main class="main">
    <header class="header">
      <h1>Gestión de Usuarios</h1>
      <p>Administra BeLabs</p>
      <button class="btn-action" id="logoutBtn">Cerrar sesión</button>
    </header>

<section class="card">
      <table>
        <thead>
          <tr>
            <th>documento</th>
            <th>nombre</th>
            <th>apellidos</th>
            <th>ciudad</th>
            <th>clan</th>
            <th>analizar</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <!-- Los usuarios se renderizan aquí dinámicamente -->
        </tbody>
      </table>
    </section>
  
  </main>

  <script>
    // esperamos DOM
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('logoutBtn');
      btn?.addEventListener('click', () => {
        localStorage.removeItem('belabs_auth');
        window.location.replace('login.html');
      });

      try {
        const authDataString = localStorage.getItem('belabs_auth');
        if (!authDataString) throw new Error('No auth data');

        const authData = JSON.parse(authDataString);

        const emailElement = document.getElementById('userEmail');
        const pictureElement = document.getElementById('profilePicture');

        if (emailElement && authData.email) {
          emailElement.textContent = authData.email;
        }

        if (pictureElement && authData.photoUrl) {
          pictureElement.src = authData.photoUrl;
        }
      } catch (err) {
        console.error('Error al cargar datos de usuario:', err);
      }
    });
  </script>
</body>

</html>
<script src="./services/render.js" type="module" ></script>
