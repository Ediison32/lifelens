<section id="stroop-section">
    <h2>Test de Stroop</h2>
    <div id="container">
        <button id="start-btn">Iniciar Test</button>

        <div id="test" class="hidden">
            <h2 id="task-title"></h2>
            <p id="instructions"></p>
            <p id="task-counter"></p>
            <button id="start-task-btn" class="hidden">Comenzar Tarea</button>
            <div id="timer" class="hidden"></div>
            <div class="stimulus" id="stimulus"></div>
            <div class="options" id="options"></div>
        </div>

        <div id="result" class="hidden"></div>

    </div>
    
</section>
