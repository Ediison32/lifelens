<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tests Cognitivos</title>
  <link rel="stylesheet" href="./back.css">
</head>
<body>

  <header>
    <h1>🧠 Bienvenido a la Plataforma de Tests Cognitivos</h1>
    <p>Inicia tu sesión para continuar</p>
  </header>

 <main class="test-container">

    <div class="test-card">
      <img src="https://placehold.co/400x200?text=Inicia%20Sesion" alt="">
      <p class="card-subtitle">Ingresa tu número de identificación</p>

      <form class="login-form">
        <input type="number" id="identificacion" placeholder="Número de identificación" required>
        <button type="submit" class="btn">Entrar</button>
      </form>
    </div>

    <div class="test-card">
        <img src="https://placehold.co/400x200?text=BeLabs" alt="">
      <div class="info">
        <p>Mide tu capacidad de atención y tiempo de reacción</p>
        <a href="/frontend/index.html" class="btn">Iniciar Test</a>
      </div>
    </div>

  </main>

</body>
</html>
